# QLoRA configuration for Bullfinch runs (copied from Serin 4B). Freeze this file with every run.
base_model: Qwen/Qwen3.5-4B
base_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a   # pinned 2026-10-20 for Serin 4B
text_only: true              # AutoModelForCausalLM loads Qwen3_5ForCausalLM: no vision tower
task: typed_decision         # choice / noul / score, rendered as lettered options

prompt:
  template_version: decision-v1
  chat_template: true
  enable_thinking: false
  answer_prefill: '{"answer": "'
  option_codes: letters      # A..Z, single tokens; the engine checks this at load
  shuffle_options: true      # training only
  phrasing_variants_per_record: 3

data:
  examples: data/examples/*.jsonl     # DecisionExample JSONL from the converters
  train: official train splits
  dev_panel: official validation, or carved from train by group   # early stopping only
  calibration: carved from train by group
  test: official test splits, Belebele, INCLUDE, OpenDecisions    # never trained on
  max_length: 2048
  split_unit: source_record

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  # Frozen from Serin's inspect_model.py (2026-10-20). Qwen3.5 is hybrid:
  #   8 full-attention layers: q_proj k_proj v_proj o_proj
  #   24 Gated DeltaNet layers: in_proj_qkv in_proj_z out_proj (in_proj_a / in_proj_b are
  #      per-head gate projections, output width = head count, left frozen)
  #   all 32 layers: gate_proj up_proj down_proj
  # lm_head stays frozen (tied to the embeddings).
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv
    - in_proj_z
    - out_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  seed: 7
  learning_rate: 0.0002
  lr_scheduler: cosine
  warmup_ratio: 0.03
  num_train_epochs: 1          # stop early on the dev panel
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  bf16: true
  loss: answer_token_only      # soft targets when distilling
  eval_steps: 500
  logging_steps: 10
  save_strategy: steps
  save_steps: 500

calibration:
  method: temperature_per_question_type
  output: artifacts/CALIBRATION.json
  target_errors: [0.01, 0.05]

inference:
  scoring: option_code_logits
  temperature: 0
  do_sample: false
  option_order: fixed          # evaluation; serving may average permutations
